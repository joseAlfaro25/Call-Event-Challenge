[project]
name = "call-event-orchestrator"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.9.2",
    "PyYAML==6.0.1",
    "jsonschema==4.25.0",
    "langgraph==0.2.28",
    "langgraph-checkpoint==1.0.12",
    "langgraph-checkpoint-sqlite==1.0.4",
    "langchain-openai==0.3.31",
    "python-dotenv==1.1.1",
]

[project.optional-dependencies]
dev = ["ruff==0.14.5"]

[tool.pytest.ini_options]
pythonpath = ["src"]

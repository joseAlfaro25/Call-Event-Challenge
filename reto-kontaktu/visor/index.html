<style>

}}
:root[data-theme=dark]{
  --bg:#17150f; --panel:#211e18; --linea:#3a352c; --texto:#f5f0e8; --suave:#a8a29e;
  --acento:#fb923c; --ok:#4ade80; --mal:#f87171; --aviso:#fbbf24;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--texto);display:flex;flex-direction:column;
  font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
header{border-bottom:1px solid var(--linea);padding:18px 24px;display:flex;
  align-items:baseline;gap:16px;flex-wrap:wrap;background:var(--panel)}
h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em}
h1 span{color:var(--acento)}
.sub{color:var(--suave);font-size:13px}
.cargar{margin-left:auto;display:flex;align-items:center;gap:10px}
label.btn{border:1px solid var(--linea);background:var(--bg);padding:7px 14px;border-radius:7px;
  cursor:pointer;font-size:13px;font-weight:550}
label.btn:hover{border-color:var(--acento);color:var(--acento)}
input[type=file]{display:none}
main{display:grid;grid-template-columns:minmax(340px,420px) 1fr;gap:0;
  flex:1;min-height:0;overflow:hidden}
@media (max-width:900px){main{grid-template-columns:1fr;overflow:visible}}
/* min-width:0 es obligatorio: un hijo de grid no encoge por debajo de su contenido
   sin él, y el panel derecho desborda en pantallas estrechas. */
#cola{border-right:1px solid var(--linea);overflow-y:auto;background:var(--panel);min-width:0}
#detalle{overflow-y:auto;padding:22px 26px;min-width:0}
.fila{padding:13px 18px;border-bottom:1px solid var(--linea);cursor:pointer;display:grid;
  grid-template-columns:26px 1fr auto;gap:11px;align-items:start}
.fila:hover{background:var(--bg)}
.fila[aria-selected=true]{background:var(--bg);box-shadow:inset 3px 0 0 var(--acento)}
.n{font:11px/1.6 var(--mono);color:var(--suave)}
.nom{font-weight:600;font-size:14px}
.meta{color:var(--suave);font-size:12px;margin-top:2px}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--linea);
  white-space:nowrap;font-weight:550}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.mal{color:var(--mal);border-color:var(--mal)}
.pill.crit{background:var(--mal);color:#fff;border-color:var(--mal)}
h2{font-size:15px;margin:26px 0 10px;font-weight:650}
h2:first-child{margin-top:0}
table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:13px;margin-bottom:6px}
td,th{border-bottom:1px solid var(--linea);padding:6px 10px 6px 0;text-align:left;
  vertical-align:top;overflow-wrap:anywhere}
th{color:var(--suave);font-weight:550;width:180px}
code,.mono{font-family:var(--mono);font-size:12.5px}
.turno{display:grid;grid-template-columns:52px 74px 1fr;gap:10px;padding:5px 0;
  border-bottom:1px solid var(--linea);font-size:13.5px}
.seg{color:var(--suave);font-family:var(--mono);font-size:11.5px;text-align:right}
.quien{color:var(--suave);font-size:11.5px;font-weight:600;text-transform:uppercase;
  letter-spacing:.03em}
.quien.agente{color:var(--acento)}
.orden{border:1px solid var(--linea);border-radius:8px;padding:12px 14px;margin-bottom:9px;
  background:var(--panel)}
.orden.ok{border-left:3px solid var(--ok)}
.orden.mal{border-left:3px solid var(--mal)}
.orden .op{font-weight:650;font-size:13px;font-family:var(--mono)}
.orden pre{margin:8px 0 0;font-size:12px;white-space:pre-wrap;word-break:break-word;
  color:var(--suave)}
.fallo{color:var(--mal);font-size:12.5px;margin-top:5px}
.nota{background:var(--bg);border-left:3px solid var(--aviso);padding:9px 13px;
  font-size:13px;margin:10px 0;color:var(--suave)}
.vacio{color:var(--suave);padding:60px 26px;text-align:center;font-size:14px}
.marcador{display:flex;gap:22px;padding:13px 18px;border-bottom:1px solid var(--linea);
  font-size:13px;background:var(--bg)}
.marcador b{display:block;font-size:19px;font-weight:650;letter-spacing:-.02em}
</style></head><body>

    const s = RES.resumen;
    html += `<div class="marcador">
      <div><b>${s.ok}/${s.total}</b>eventos</div>
      <div><b>${s.etiquetas_ok}/${s.total}</b>etiquetas</div>
      <div><b>${s.ordenes_ok}/${s.ordenes_esperadas}</b>órdenes</div>
      <div><b>${s.criticos_fallados}</b>críticos fallados</div></div>`;
  }
  EVENTOS.forEach((ev, i) => {
    const d = DEC[ev.event_id], ok = evalDe(i);
    let pill = "";
    if (ok) pill = ok.ok ? `<span class="pill ok">ok</span>`
      : `<span class="pill ${ok.severidad === "critica" ? "crit" : "mal"}">${ok.severidad === "critica" ? "crítico" : "falla"}</span>`;
    else if (d) pill = `<span class="pill">${esc(d.etiqueta)}</span>`;
    const nOrd = (ORD[ev.event_id] || []).length;
    html += `<div class="fila" data-i="${i}" aria-selected="${i === sel}">
      <div class="n">${String(i + 1).padStart(2, "0")}</div>
      <div><div class="nom">${esc(ev.lead.full_name || "—")}</div>
        <div class="meta">${hora(ev.occurred_at)} · ${ev.type === "message.received" ? "WhatsApp entrante"
          : (ev.telephony?.answered_at ? ev.telephony.duration_seconds + " s" : "sin descuelgue")}
          ${nOrd ? " · " + nOrd + " órdenes" : ""}</div></div>
      <div>${pill}</div></div>`;
  });
  cola.innerHTML = html;
  cola.querySelectorAll(".fila").forEach(f =>
    f.onclick = () => { sel = +f.dataset.i; pintar(); detalle(); });
  detalle();
}

function detalle() {
  const ev = EVENTOS[sel], d = DEC[ev.event_id], ords = ORD[ev.event_id] || [], r = evalDe(sel);
  let h = `<h2>${esc(ev.lead.full_name || "—")} <span class="sub mono">${esc(ev.event_id)}</span></h2>`;

  if (r && r.nota) h += `<div class="nota"><b>Nota del corrector:</b> ${esc(r.nota)}</div>`;

  h += `<table><tr><th>Tipo</th><td class="mono">${esc(ev.type)}</td></tr>
    <tr><th>Ocurrió</th><td>${hora(ev.occurred_at)}</td></tr>
    <tr><th>Organización</th><td class="mono">${esc(ev.organization_id)}</td></tr>
    <tr><th>Clave idempotencia</th><td class="mono">${esc(ev.idempotency_key)}</td></tr>
    <tr><th>Inmueble</th><td>${esc(ev.lead.property_ref || "—")} · ${esc(ev.lead.property_address || "dirección no disponible")}</td></tr>`;

  if (ev.telephony) { const t = ev.telephony;
    h += `<tr><th>SIP</th><td class="mono">${t.sip_status_code} ${esc(t.sip_status)}</td></tr>
      <tr><th>Desconexión</th><td class="mono">${esc(t.disconnect_reason)} · colgó ${esc(t.hung_up_by || "—")}</td></tr>
      <tr><th>Descuelgue</th><td>${t.answered_at ? hora(t.answered_at) : "nunca"} · ${t.duration_seconds} s</td></tr>
      <tr><th>Contestador</th><td class="mono">${esc(t.amd.result)} (${esc(t.amd.source)})</td></tr>`;
    if (t.amd.greeting_transcript)
      h += `<tr><th>Saludo oído</th><td><i>«${esc(t.amd.greeting_transcript)}»</i></td></tr>`;
  }
  if (ev.agent_outcome) { const a = ev.agent_outcome;
    h += `<tr><th>Desenlace del agente</th><td class="mono">${esc(a.call_outcome || "(vacío)")}${a.reason ? " · " + esc(a.reason) : ""}</td></tr>`;
    if (a.appointment) h += `<tr><th>Cita creada</th><td class="mono">${esc(a.appointment.appointment_id)} · ${hora(a.appointment.start_time)}</td></tr>`;
    if (a.slots_snapshot && Object.keys(a.slots_snapshot).length)
      h += `<tr><th>Slots recogidos</th><td class="mono">${esc(JSON.stringify(a.slots_snapshot))}</td></tr>`;
  }
  if (ev.message) h += `<tr><th>Mensaje</th><td>«${esc(ev.message.text)}»</td></tr>`;
  h += `</table>`;

  if (ev.transcript && ev.transcript.length) {
    h += `<h2>Transcripción</h2>`;
    ev.transcript.forEach(t => h += `<div class="turno"><div class="seg">${t.time_in_call_secs}s</div>
      <div class="quien ${t.role === "agent" ? "agente" : ""}">${t.role === "agent" ? "agente" : "lead"}</div>
      <div>${esc(t.message)}</div></div>`);
  } else if (ev.type === "call.ended") {
    h += `<h2>Transcripción</h2><p class="sub">Sin conversación.</p>`;
  }

  h += `<h2>Decisión</h2>`;
  h += d ? `<table><tr><th>Etiqueta</th><td class="mono">${esc(d.etiqueta)}${
      r && r.etiqueta_esperada !== d.etiqueta ? ` <span class="pill mal">esperada: ${esc(r.etiqueta_esperada)}</span>` : ""}</td></tr>
    <tr><th>Motivo</th><td>${esc(d.motivo)}</td></tr>
    <tr><th>Confianza</th><td class="mono">${d.confianza}</td></tr></table>`
    : `<p class="sub">Sin decisión para este evento.${r ? ` Se esperaba <code>${esc(r.etiqueta_esperada)}</code>.` : ""}</p>`;

  h += `<h2>Órdenes</h2>`;
  if (r) {
    if (!r.ordenes.length) h += `<p class="sub">No se esperaba ninguna orden${ords.length ? ", y se emitieron " + ords.length : ", y no se emitió ninguna"}.</p>`;
    r.ordenes.forEach(o => {
      h += `<div class="orden ${o.ok ? "ok" : "mal"}"><div class="op">${esc(o.operacion)}</div>`;
      o.motivos.forEach(m => h += `<div class="fallo">${esc(m)}</div>`);
      if (o.cuerpo_recibido) h += `<pre>${esc(JSON.stringify(o.cuerpo_recibido, null, 1))}</pre>`;
      h += `</div>`;
    });
  } else if (ords.length) {
    ords.forEach(o => h += `<div class="orden"><div class="op">${esc(o.operacion)}</div>
      <pre>${esc(JSON.stringify(o.cuerpo, null, 1))}</pre></div>`);
  } else {
    h += `<p class="sub">Ninguna.</p>`;
  }
  $("#detalle").innerHTML = h;
}
pintar();
</script></body></html>
